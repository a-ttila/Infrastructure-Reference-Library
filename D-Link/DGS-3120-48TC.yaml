###########################################################################
# Device Type : D-Link DGS-3120-48TC
# Vendor      : D-Link
# Version     : 1.2
# Created     : 2026-08-14
# Notes       : xStack L2+ Managed Stackable Gigabit Switch.
#               44x 10/100/1000BASE-T ports + 4x 10/100/1000BASE-T/SFP
#               combo ports + 2x dedicated physical stacking ports.
#               Combo interfaces are modelled as separate Copper/Fiber
#               connectors (only one connector may be active at a time).
#               Interface naming confirmed against live `show ports`
#               CLI output: ports are prefixed with the stack unit
#               number (e.g. "1:45 (C)", "1:45 (F)") - modelled using
#               the {vc_position} template variable so names resolve
#               correctly for any stack position.
#               Stacking ports are proprietary connectors (used only
#               with DEM-CB50/CB100/CB300 stacking cables, up to 40Gbps
#               full-duplex, max. 6 units per stack) - modelled as
#               "other" type interfaces since no standard NetBox
#               interface type applies. Confirmed via live CLI that
#               these ports do NOT appear in `show ports` output (they
#               sit outside the switching fabric's normal port list),
#               so no {vc_position} prefix is applied to their names.
#               No separate out-of-band MGMT port on this model (unlike
#               DGS-3420 series) - only a console port is present.
#               Fixed internal power supply; optional external
#               redundant power supply (DPS-500 / DPS-500DC) connects
#               via a separate power port, not modelled as an internal
#               hot-swap module bay. SD card slot exists on the
#               physical unit but has no direct NetBox interface/port
#               equivalent; modelled as an inventory item.
###########################################################################
