manufacturer: D-Link
model: DGS-3120-48TC
slug: d-link-dgs-3120-48tc
part_number: DGS-3120-48TC
comments: >
  [D-Link DGS-3120-48TC](https://www.dlink.com/en/products/dgs-3120-48tc-xstack-l3-managed-gigabit-switch) —
  48-Port Gigabit L2+ Stackable Managed Switch (xStack Series). Supports
  physical stacking up to 6 units (288 Gigabit ports, 40Gbps full-duplex
  stacking bandwidth) via 2 dedicated stacking ports, and virtual
  stacking (D-Link Single IP Management) up to 32 units. Optional
  external Redundant Power Supply: DPS-500 (140W) or DPS-500DC.
